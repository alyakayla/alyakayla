name: README Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"  # Runs daily at 04:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the default GITHUB_TOKEN push the updated SVGs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore LOC cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: loc-${{ github.run_id }}
          restore-keys: loc-

      - name: Create cache folder
        run: mkdir -p cache

      - name: Update README SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: update README stats" || echo "No changes to commit"

      - name: Push changes
        # plain `git push` reuses the credentials actions/checkout stored in the
        # local git config. Pushing to a token-in-URL does NOT work here:
        # checkout's http.https://github.com/.extraheader wins over URL credentials,
        # so the push is attempted as github-actions[bot] with the default read-only
        # GITHUB_TOKEN and the remote rejects it. Hence permissions: contents: write above.
        run: git push
